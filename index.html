].join('\n');

/* ---------- 스타일 ---------- */
var CSS = `
:root{
  --bg:#ECEFF5; --surface:#FFFFFF; --ink:#16203A; --muted:#5A6480; --line:#D6DCE8;
  --brand-bg:#13295B; --brand-ink:#FFFFFF; --brand-text:#1B3A80;
  --accent:#F4B400; --accent-ink:#231A00; --accent-soft:#FFF4D1;
  --danger:#B8322A; --ok:#1E7349; --tile:#E2E8F4; --tile-ink:#1B3A80;
  --receipt:#FFFFFF; --overlay:rgba(14,22,44,.55); --focus:#2F6BFF;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1322; --surface:#171F35; --ink:#E7EBF5; --muted:#9BA5BF; --line:#2A3453;
    --brand-bg:#152C63; --brand-ink:#FFFFFF; --brand-text:#A9C1FF;
    --accent:#F4B400; --accent-ink:#231A00; --accent-soft:#3A3014;
    --danger:#FF7A6E; --ok:#62D19A; --tile:#222C49; --tile-ink:#B8CBFF;
    --receipt:#1B2440; --overlay:rgba(0,0,0,.6); --focus:#7FA6FF;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1322; --surface:#171F35; --ink:#E7EBF5; --muted:#9BA5BF; --line:#2A3453;
  --brand-bg:#152C63; --brand-ink:#FFFFFF; --brand-text:#A9C1FF;
  --accent:#F4B400; --accent-ink:#231A00; --accent-soft:#3A3014;
  --danger:#FF7A6E; --ok:#62D19A; --tile:#222C49; --tile-ink:#B8CBFF;
  --receipt:#1B2440; --overlay:rgba(0,0,0,.6); --focus:#7FA6FF;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none !important}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:${FONT};font-size:16px;line-height:1.55;font-feature-settings:"tnum" 1}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.top{background:var(--brand-bg);color:var(--brand-ink)}
.top-in{max-width:1180px;margin:0 auto;padding:22px 20px 26px;display:flex;flex-wrap:wrap;gap:18px 28px;align-items:flex-end;justify-content:space-between}
.brand{margin:0 0 6px;font-size:.95rem;font-weight:500;opacity:.85}
.top h1{margin:0;font-size:clamp(1.45rem,1.05rem + 1.7vw,2.15rem);line-height:1.2;font-weight:700;letter-spacing:-.01em}
.addr{margin:8px 0 0;font-size:.92rem;opacity:.85}
.top-act{display:flex;flex-wrap:wrap;gap:8px}
.tbtn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid rgba(255,255,255,.35);color:#fff;text-decoration:none;font-weight:600;font-size:.95rem;background:transparent}
.tbtn:hover{background:rgba(255,255,255,.1)}
.tbtn.kakao{background:#FEE500;color:#191600;border-color:#FEE500}
.tbtn.kakao:hover{background:#F5DA00}
.tbtn svg{width:18px;height:18px;flex:none}

.layout{max-width:1180px;margin:0 auto;padding:20px;display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:22px;align-items:start}
.col{display:flex;flex-direction:column;gap:18px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px}
.ph{display:flex;align-items:center;gap:12px;margin:0 0 16px}
.step{flex:none;width:30px;height:30px;border-radius:50%;background:var(--brand-bg);color:var(--brand-ink);display:grid;place-items:center;font-weight:700;font-size:.9rem}
.ph h2{margin:0;font-size:1.2rem;font-weight:700}
.ph p{margin:0;color:var(--muted);font-size:.88rem}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f.wide{grid-column:1/-1}
.f label,.f .lab{font-weight:600;font-size:.92rem}
.req{color:var(--danger);font-weight:700;margin-left:2px}
.in{width:100%;min-height:48px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:16px}
.in:focus{border-color:var(--focus)}
textarea.in{min-height:120px;resize:vertical;line-height:1.6}
.f.err .in{border-color:var(--danger);box-shadow:0 0 0 1px var(--danger)}
.emsg{display:none;color:var(--danger);font-size:.84rem}
.dmsg{margin:0;font-size:.84rem;color:var(--muted);line-height:1.45}
.dmsg.warn{color:var(--danger);font-weight:600}
.dmsg.ok{color:var(--ok);font-weight:600}
.f.err .dmsg:empty{display:none}
.qwarn{margin:4px 0 0;color:var(--danger);font-weight:700;font-size:.9rem}
.f.err .emsg{display:block}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.opt{position:relative}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt span{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border:1px solid var(--line);border-radius:10px;cursor:pointer;font-weight:500;background:var(--surface)}
.opt input:checked + span{border-color:var(--brand-text);color:var(--brand-text);box-shadow:inset 0 0 0 1px var(--brand-text);font-weight:700}
.opt input:focus-visible + span{outline:3px solid var(--focus);outline-offset:2px}
.check{display:flex;align-items:center;gap:10px;min-height:40px;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--brand-bg)}
.hint{margin:0;color:var(--muted);font-size:.86rem}

.search{position:relative;margin-bottom:12px}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted)}
.search .in{padding-left:42px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px;scrollbar-width:thin}
.chip{flex:none;min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:.92rem;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--brand-bg);color:var(--brand-ink);border-color:var(--brand-bg)}
.chip small{font-weight:500;opacity:.75;margin-left:4px}
.note{margin:4px 0 14px;padding:10px 14px;border-radius:10px;background:var(--accent-soft);font-size:.88rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.mcard{position:relative;display:grid;grid-template-columns:76px minmax(0,1fr);gap:12px;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.mcard.is-sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.thumb{width:76px;height:76px;border-radius:12px;overflow:hidden;background:var(--tile);display:grid;place-items:center}
.thumb{position:relative}
.thumb.has-img{background:#F4F6FB}
.thumb img{width:100%;height:100%;object-fit:contain}
.ttag{position:absolute;left:0;right:0;bottom:0;background:#13295B;color:#fff;font-size:.68rem;font-weight:700;text-align:center;line-height:1.7}
.size{font-weight:500;color:var(--muted);font-size:.84rem;margin-left:8px}
.tile{font-size:1.7rem;font-weight:700;color:var(--tile-ink)}
.mcard h3{margin:0;font-size:1rem;font-weight:700;line-height:1.3;padding-right:56px;word-break:keep-all;overflow-wrap:anywhere}
.price{margin:2px 0 8px;font-weight:600;color:var(--brand-text)}
.temps{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:8px}
.temps button{border:0;background:transparent;min-height:32px;padding:0 12px;font-size:.82rem;font-weight:700;cursor:pointer;color:var(--muted)}
.temps button[aria-pressed="true"][data-t="HOT"]{background:#C9452F;color:#fff}
.temps button[aria-pressed="true"][data-t="ICE"]{background:#2C67C9;color:#fff}
.tonly{display:inline-block;font-size:.8rem;font-weight:700;color:var(--muted);margin-bottom:8px}
.stepper{display:flex;align-items:center;gap:6px}
.sb{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:1.15rem;font-weight:700;cursor:pointer;display:grid;place-items:center;line-height:1}

/* ---------- 도우미 ---------- */
function $(s, r){ return (r||document).querySelector(s); }
function $$(s, r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function won(n){ return (Number(n)||0).toLocaleString('ko-KR') + '원'; }
function itemById(id){ for (var i=0;i<MENU.items.length;i++) if (MENU.items[i].id===id) return MENU.items[i]; return null; }
function keyOf(id, t){ return id + '|' + (t || '-'); }
function norm(s){ return String(s||'').toLowerCase().replace(/\s+/g,''); }
function pad(n){ return n<10 ? '0'+n : ''+n; }
function fmtDate(v){
  if (!v) return '';
  var p = v.split('-'); if (p.length!==3) return v;
  var d = new Date(+p[0], +p[1]-1, +p[2]);
  return p[0] + '년 ' + (+p[1]) + '월 ' + (+p[2]) + '일 (' + '일월화수목금토'[d.getDay()] + ')';
}
function fmtTime(v){
  if (!v) return '';
  var p = v.split(':'); var h = +p[0], m = p[1];
  return (h<12 ? '오전 ' : '오후 ') + (h%12===0 ? 12 : h%12) + ':' + m;
}
function fmtPhone(v){
  var d = String(v||'').replace(/\D/g,'').slice(0,11);
  if (d.indexOf('02')===0){
    if (d.length<=2) return d; if (d.length<=5) return d.slice(0,2)+'-'+d.slice(2);
    if (d.length<=9) return d.slice(0,2)+'-'+d.slice(2,5)+'-'+d.slice(5);
    return d.slice(0,2)+'-'+d.slice(2,6)+'-'+d.slice(6,10);
  }
  if (d.length<=3) return d; if (d.length<=7) return d.slice(0,3)+'-'+d.slice(3);
  if (d.length<=10) return d.slice(0,3)+'-'+d.slice(3,6)+'-'+d.slice(6);
  return d.slice(0,3)+'-'+d.slice(3,7)+'-'+d.slice(7);
}
function today(){ try { return new Date().toLocaleDateString('en-CA', {timeZone:'Asia/Seoul'}); } catch(e){ var d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); } }
function dayDiff(v){ if (!v) return null; return Math.round((Date.parse(v+'T00:00:00Z') - Date.parse(today()+'T00:00:00Z'))/86400000); }

function lines(){
  var out = [];
  MENU.items.forEach(function(it){
    if (it.hidden) return;
    var ts = it.temps.length ? it.temps : ['-'];
    ts.forEach(function(t){
      var q = state.qty[keyOf(it.id, t==='-'?'':t)] || 0;
      if (q>0) out.push({ key:keyOf(it.id, t==='-'?'':t), item:it, temp:t==='-'?'':t, qty:q, sub:q*it.price });
    });
  });
  return out;
}
function totals(){ var c=0,s=0; lines().forEach(function(l){ c+=l.qty; s+=l.sub; }); return {count:c, sum:s}; }

var toastTimer;

  clearTimeout(toastTimer); toastTimer = setTimeout(function(){ t.hidden = true; }, ms || 2800);
}

/* ---------- 런타임 기능 (claude.ai 안에서만) ---------- */
var capCache = {};
function inClaude(){ return !!(window.claude && typeof window.claude.use === 'function'); }
function cap(name){
  if (!inClaude()) return Promise.resolve(null);
  if (!capCache[name]) capCache[name] = Promise.resolve().then(function(){ return window.claude.use(name); }).catch(function(){ return null; });
  return capCache[name];
}
function saveFile(filename, data, mime){
  return cap('downloads').then(function(dl){
    if (dl) {
      return dl.save({ filename:filename, data:data }).then(function(){ return 'saved'; }, function(e){
        var c = e && e.code;
        if (c==='declined') return 'declined';
        if (c==='rate_limited') return 'busy';
        return 'unavailable';
      });
    }
    if (inClaude()) return 'unavailable';
    var blob = data instanceof Blob ? data : new Blob([data], {type: mime || 'application/octet-stream'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a'); a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
    return 'saved';
  });
}

function setQty(key, q){
  q = Math.max(0, Math.min(999, Math.floor(Number(q)||0)));
  if (q) state.qty[key] = q; else delete state.qty[key];
  syncCard(key.split('|')[0]);
  renderReceipt();
}

/* ---------- 임시 저장 ---------- */
function stamp(ts){ var d = new Date(ts); return (d.getMonth()+1) + '월 ' + d.getDate() + '일 ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function saveDraft(){
  try {
    var ts = Date.now();
    localStorage.setItem(LS_KEY, JSON.stringify({ savedAt:ts, state:state }));
    $('#saved-at').textContent = '마지막 임시 저장: ' + stamp(ts);
    toast('이 기기에 임시 저장했습니다. 다음에 열면 이어서 작성할 수 있어요.');
  } catch(e){ toast('이 브라우저에서는 임시 저장을 쓸 수 없습니다. 개인정보 보호 모드인지 확인해 주세요.', 4000); }
}
function mergeState(s){
  var b = blank(); if (!s || typeof s!=='object') return b;
  b.info = Object.assign(b.info, s.info||{});
  b.qty = {}; Object.keys(s.qty||{}).forEach(function(k){ var q = Math.floor(Number(s.qty[k])||0); if (q>0) b.qty[k] = Math.min(999,q); });
  b.temp = Object.assign({}, s.temp||{});
  if (PACK[s.pack]) b.pack = s.pack;
  b.extras = Object.assign(b.extras, s.extras||{});
  b.sticker = Object.assign(b.sticker, s.sticker||{}); if (!STICKER[b.sticker.type]) b.sticker.type='none';
  b.memo = typeof s.memo==='string' ? s.memo.slice(0,500) : '';
  return b;
}
function loadDraft(){
  var ext = readCarryParam();
  if (ext){ state = mergeState(ext); return 'carry-ext'; }
  try {
    var carry = sessionStorage.getItem(SS_KEY);
    if (carry){ sessionStorage.removeItem(SS_KEY); state = mergeState(JSON.parse(carry)); return 'carry'; }
  } catch(e){}
  try {
    var raw = localStorage.getItem(LS_KEY);
    if (!raw) return null;
    var d = JSON.parse(raw); state = mergeState(d.state);
    $('#saved-at').textContent = '마지막 임시 저장: ' + stamp(d.savedAt);
    return d.savedAt;
  } catch(e){ return null; }
}

function validate(){
  var bad = [];
  var i = state.info;
  var dd = dayDiff(i.date);
  if (!i.date || dd<0) bad.push('date');
  $('[data-f="date"] .emsg').textContent = i.date ? '' : '행사일을 선택해 주세요.';

    toast('필수 항목을 입력해 주세요: ' + bad.map(function(b){ return {date: i.date ? '행사일(지난 날짜)' : '행사일',group:'단체명',name:'담당자명',phone:'연락처'}[b]; }).join(', '), 3500);
    return false;
  }
  if (!lines().length){ toast('메뉴를 1개 이상 골라 주세요.'); $('#q').scrollIntoView({block:'center'}); return false; }
  return true;
}

/* ---------- 견적서 이미지 ---------- */
function quoteNo(){ var d = new Date(); return 'SG' + String(d.getFullYear()).slice(2) + pad(d.getMonth()+1) + pad(d.getDate()) + '-' + pad(d.getHours()) + pad(d.getMinutes()); }
function wrap(ctx, text, maxW){
  var out = [];
  String(text||'').split('\n').forEach(function(para){
    if (!para){ out.push(''); return; }
    var line = '';
    for (var i=0;i<para.length;i++){
      var test = line + para[i];
      if (ctx.measureText(test).width > maxW && line){ out.push(line); line = para[i]===' ' ? '' : para[i]; }
      else line = test;
    }
    out.push(line);
  });
  return out;
}
function fit(ctx, text, maxW){
  if (ctx.measureText(text).width <= maxW) return text;
  while (text.length && ctx.measureText(text + '…').width > maxW) text = text.slice(0,-1);
  return text + '…';
}
function makeQuoteCanvas(){
  var loads = [];
  try { if (document.fonts && document.fonts.load) loads = [document.fonts.load('400 24px "IBM Plex Sans KR"'), document.fonts.load('700 24px "IBM Plex Sans KR"'), document.fonts.load('600 24px "IBM Plex Sans KR"')]; } catch(e){}
  var imgs = {};
  lines().forEach(function(l){ if (l.item.img && !imgs[l.item.id]) imgs[l.item.id] = new Promise(function(res){ var im = new Image(); im.onload = function(){ res(im); }; im.onerror = function(){ res(null); }; im.src = l.item.img; }); });
  loads = loads.concat(Object.keys(imgs).map(function(id){ return imgs[id].then(function(im){ imgs[id] = im; }); }));
  return Promise.all(loads).catch(function(){}).then(function(){
    var W = 1080, P = 64, H = 9000;
    var c = document.createElement('canvas'); c.width = W; c.height = H;
    var x = c.getContext('2d');
    function f(w, s){ x.font = w + ' ' + s + 'px ' + FONT; }
    var NAVY = '#13295B', INK = '#16203A', MUTED = '#5A6480', LINE = '#D6DCE8';
    x.fillStyle = '#FFFFFF'; x.fillRect(0,0,W,H);
    x.textBaseline = 'alphabetic';

    // 머리
    x.fillStyle = NAVY; x.fillRect(0,0,W,236);
    x.fillStyle = '#FFFFFF'; f(500,28); x.fillText(STORE.name, P, 84);
    f(700,58); x.fillText('단체주문 견적서', P, 162);
    x.textAlign = 'right'; f(500,24); x.globalAlpha = .85;
    x.fillText('견적번호 ' + quoteNo(), W-P, 84);
    var now = new Date();
    x.fillText('작성일 ' + now.getFullYear() + '.' + pad(now.getMonth()+1) + '.' + pad(now.getDate()), W-P, 120);
    x.globalAlpha = 1; x.textAlign = 'left';
    x.fillStyle = '#F4B400'; f(700,24); x.fillText('행사일 최소 3일 전 문의', P, 208);
    x.fillRect(0,236,W,8);

    var y = 310;
    function section(title){
      x.fillStyle = NAVY; f(700,30); x.fillText(title, P, y); y += 22;
      x.fillStyle = NAVY; x.fillRect(P, y, W-2*P, 3); y += 46;
    }
    function kv(k, v){
      f(500,26); x.fillStyle = MUTED; x.fillText(k, P, y);
      f(600,26); x.fillStyle = INK;

// 카카오톡 채널 대화방에서 + → 앨범으로 보내게 합니다. Chrome·Safari는 기존처럼 복사 → 붙여넣기.
// 카카오톡 등 앱 내부 브라우저는 복사·공유가 모두 막혀 있어, 작성 내용을 담아
// 휴대폰 기본 브라우저(삼성 인터넷이든 Chrome이든)로 넘깁니다.
function env(){
  var ua = navigator.userAgent || '';
  var android = /Android/i.test(ua), ios = /iPhone|iPad|iPod/i.test(ua);
  var kakao = /KAKAOTALK/i.test(ua);
  var samsung = /SamsungBrowser/i.test(ua);
  var inapp = kakao || /; wv\)|NAVER\(inapp|Instagram|FBAN|FBAV|FB_IAB|Line\/|DaumApps|BAND\/|everytimeApp/i.test(ua);
  var chrome = android && !inapp && !samsung && /Chrome\//.test(ua) && !/EdgA|OPR\/|Whale|Firefox|YaBrowser|MiuiBrowser|HeyTap|UCBrowser/i.test(ua);
  return { android:android, ios:ios, kakao:kakao, samsung:samsung, inapp:inapp,
    needExternal: android && inapp,           // 앱 내부 브라우저 → 기본 브라우저로
    needSafari: ios && inapp,

function b64e(str){ return btoa(unescape(encodeURIComponent(str))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function b64d(str){ str = str.replace(/-/g,'+').replace(/_/g,'/'); while (str.length % 4) str += '='; return decodeURIComponent(escape(atob(str))); }
function carryUrl(){
  var u = new URL(location.href);
  u.hash = '';
  u.searchParams.set('carry', b64e(JSON.stringify(state)));
  return u.toString();
}
function readCarryParam(){
  try {
    var u = new URL(location.href), c = u.searchParams.get('carry');
    if (!c) return null;
    u.searchParams.delete('carry');
    history.replaceState(null, '', u.pathname + u.search + u.hash);
    return JSON.parse(b64d(c));
  } catch(e){ return null; }
}
function openExternal(){
  var e = env(), url = carryUrl();
  if (e.kakao){
    // 카카오톡 전용 주소: 휴대폰의 기본 브라우저(삼성 인터넷/Chrome/Safari)로 엽니다.
    location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(url);
  } else if (e.android){
    // 다른 앱 내부 브라우저: 특정 앱을 지정하지 않고 기본 브라우저로 엽니다.
    var u = new URL(url);
    location.href = 'intent://' + u.host + u.pathname + u.search + '#Intent;scheme=' + u.protocol.replace(':','') + ';action=android.intent.action.VIEW;category=android.intent.category.BROWSABLE;end';
  } else {
    toast('이 앱 안에서는 이미지 복사가 안 됩니다. 메뉴에서 “Safari로 열기”를 선택한 뒤 다시 눌러 주세요.', 8000);
    return;
  }
  var left = false;
  var onHide = function(){ if (document.hidden) left = true; };
  document.addEventListener('visibilitychange', onHide);
  setTimeout(function(){
    document.removeEventListener('visibilitychange', onHide);
    if (!left) toast('브라우저가 열리지 않았습니다. 우측 메뉴(⋮)에서 “다른 브라우저로 열기”를 누른 뒤 다시 시도해 주세요.', 9000);
  }, 1800);
}
function legacyCopy(s){
  try { var ta = document.createElement('textarea'); ta.value = s; ta.setAttribute('readonly',''); ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select(); var ok = document.execCommand('copy'); ta.remove(); return ok; } catch(e){ return false; }
}

function resizeImage(file){
  return new Promise(function(res, rej){
    var r = new FileReader();
    r.onerror = function(){ rej(new Error('read')); };
    r.onload = function(){
      var im = new Image();
      im.onerror = function(){ rej(new Error('decode')); };
      im.onload = function(){
        var S = 360, s = Math.min(im.width, im.height);
        var cv = document.createElement('canvas'); cv.width = S; cv.height = S;
        var g = cv.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0,0,S,S);
        g.drawImage(im, (im.width-s)/2, (im.height-s)/2, s, s, 0, 0, S, S);
        res(cv.toDataURL('image/jpeg', .82));
      };
      im.src = r.result;
    };
    r.readAsDataURL(file);
  });
}

        var saveTab = window.open(quoteUrl, '_blank');
        if (saveTab) toast('새 화면에 견적서 이미지가 열렸습니다. 이미지를 길게 눌러 사진 또는 파일로 저장해 주세요.', 6500);
        else toast('브라우저가 새 화면 열기를 차단했습니다. 미리보기 이미지를 길게 눌러 저장해 주세요.', 6500);
        return;
      }
      saveFile(fileBase() + '.png', quoteBlob, 'image/png').then(function(r){
        if (r==='saved') toast('견적서 이미지를 저장했습니다.');
        else if (r==='declined') toast('저장을 취소했습니다.');
        else if (r==='busy') toast('다른 저장 창이 열려 있습니다. 잠시 후 다시 눌러 주세요.');
        else toast('파일 저장이 제한되었습니다. 미리보기 이미지를 길게 누르거나 오른쪽 클릭해 저장해 주세요.', 5000);
      }); return; }
    if (act==='png-copy'){
      if (!quoteBlob){ toast('견적서 이미지가 아직 준비되지 않았습니다. 잠시 후 다시 눌러 주세요.'); return; }

      var ua = navigator.userAgent || '';
      var ev = env();
      // 1) 카카오톡 등 앱 내부 브라우저 → 작성 내용을 담아 기본 브라우저로
      if (ev.needExternal || ev.needSafari){
        toast('브라우저에서 견적서를 다시 열고 있어요. 열리면 버튼을 한 번 더 눌러 주세요.', 6000);
        openExternal();
        return;
      }
      // 2) 삼성 인터넷 등 → 붙여넣기가 안 되므로 사진으로 저장 후 앨범에서 보내기
      if (ev.useSave){ downloadQuote(); return; }
      // 3) Chrome · Safari · PC → 기존처럼 클립보드 복사
      if (window.isSecureContext && navigator.clipboard && navigator.clipboard.write && window.ClipboardItem){
        try {
          var pngItem = new ClipboardItem({'image/png': new Blob([quoteBlob], {type:'image/png'})});
          navigator.clipboard.write([pngItem]).then(function(){
            toast(/Android|iPhone|iPad|iPod/i.test(ua)
              ? '견적서 이미지가 복사되었습니다. 카카오톡 상담창을 연 뒤 입력창을 길게 눌러 붙여넣기를 선택해 주세요.'
              : '견적서 이미지가 복사되었습니다. 카카오톡 대화 입력창에서 붙여넣어 주세요.', 6500);
          }).catch(function(err){
            console.error('이미지 클립보드 복사 실패:', err);
            toast('이 브라우저에서 이미지 복사가 제한되었습니다. 카카오톡 우측 상단 메뉴에서 외부 브라우저로 열어 다시 시도해 주세요.', 7500);
          });
        } catch(err) {
          console.error('이미지 클립보드 준비 실패:', err);
          toast('이 브라우저에서 이미지 복사를 지원하지 않습니다. 카카오톡 우측 상단 메뉴에서 외부 브라우저로 열어 다시 시도해 주세요.', 7500);
        }
      } else {
        toast('이 브라우저에서는 이미지 복사를 지원하지 않습니다. 카카오톡 우측 상단 메뉴에서 외부 브라우저로 열어 다시 시도해 주세요.', 7500);
      }
      return;
    }
    if (act==='text-copy'){ copyText(quoteText()).then(function(ok){ toast(ok ? '견적 내용을 복사했습니다. 카카오톡에 붙여넣어 보내 주세요.' : '복사하지 못했습니다. 이미지 저장을 이용해 주세요.', 3500); }); return; }
  });
  $('#chips').addEventListener('keydown', function(e){
    if (e.key!=='ArrowRight' && e.key!=='ArrowLeft') return;
    var bs = $$('.chip'), i = bs.indexOf(document.activeElement); if (i<0) return;
    var n = bs[(i + (e.key==='ArrowRight'?1:-1) + bs.length) % bs.length]; n.focus(); e.preventDefault();
  });
  $('#grid').addEventListener('input', function(e){
    var el = e.target; if (!el.classList.contains('qin')) return;
    var k = el.getAttribute('data-key'); var v = el.value.replace(/\D/g,'');
    var q = Math.min(999, Number(v)||0);
    if (q) state.qty[k] = q; else delete state.qty[k];
    syncCard(k.split('|')[0]); renderReceipt();
  });
  $('#grid').addEventListener('change', function(e){ var el = e.target; if (el.classList.contains('qin')) el.value = state.qty[el.getAttribute('data-key')] || 0; });
  $('#grid').addEventListener('focusin', function(e){ if (e.target.classList.contains('qin')) e.target.select(); });
  $('#q').addEventListener('input', function(e){ ui.q = e.target.value; renderGrid(); });
  $$('[data-info]').forEach(function(el){
    el.addEventListener('input', function(){
      var k = el.getAttribute('data-info');
      if (k==='phone'){ var f = fmtPhone(el.value); if (f!==el.value) el.value = f; }
      state.info[k] = el.value;
      if (k==='date') renderDateMsg();
      var w = el.closest('.f'); if (w) w.classList.remove('err');
    });
  });
  $('#i-date').min = today();
  document.addEventListener('change', function(e){
    var el = e.target;
    if (el.name==='method'){ state.info.method = el.value; $('#addr-wrap').hidden = el.value!=='delivery'; }
    else if (el.name==='pack') state.pack = el.value;
    else if (el.name==='sticker'){ state.sticker.type = el.value; $('#sticker-wrap').hidden = el.value==='none';
      $('#sticker-hint').textContent = el.value==='logo' ? '로고·디자인 파일은 카카오톡 채널로 보내 주세요. 제작 가능 여부, 비용, 소요 시간은 매장 확인 후 안내드립니다.' : '스티커 제작 가능 여부, 비용, 소요 시간은 매장 확인 후 안내드립니다.'; }
    else if (el.hasAttribute('data-extra')) state.extras[el.getAttribute('data-extra')] = el.checked;
  });
  $('[data-sticker-text]').addEventListener('input', function(e){ state.sticker.text = e.target.value; });
  $('[data-memo]').addEventListener('input', function(e){ state.memo = e.target.value; $('#memo-len').textContent = e.target.value.length; });

  $$('.modal').forEach(function(m){
    if (m.id==='m-confirm') return;
    m.addEventListener('click', function(e){ if (e.target===m || (e.target.closest('[data-close]') && e.target.closest('.modal')===m)) closeModal(m); });
  });
  document.addEventListener('keydown', function(e){
    if (e.key!=='Escape') return;
    var open = $$('.modal').filter(function(m){ return !m.hidden; }).pop();
    if (!open) return;
    if (open.id==='m-confirm'){ var c = $('[data-close]', open); c.click(); } else closeModal(open);
  });

  // 메뉴 관리
  $('#admin-open').addEventListener('click', openAdmin);
  $('#adm-verified').addEventListener('change', function(e){ adm.verified = e.target.checked; });
  $('#adm-add').addEventListener('click', function(){
    adm.items.push({ id:uid(), cat:(MENU.categories[0]||{}).id||'', name:'새 메뉴', size:'', price:0, temps:[], img:'', tag:'', hidden:false });
    renderAdmin(); var rows = $$('.adm-row'); var last = rows[rows.length-1]; last.scrollIntoView({block:'center'}); $('[data-a="name"]', last).select();
  });
  $('#adm-list').addEventListener('input', function(e){
    var row = e.target.closest('.adm-row'); if (!row) return;
    var it = adm.items[+row.getAttribute('data-i')], a = e.target.getAttribute('data-a');
    if (a==='name') it.name = e.target.value;
    if (a==='size') it.size = e.target.value;
    if (a==='price') it.price = Math.max(0, Math.round(Number(e.target.value)||0));
  });
  $('#adm-list').addEventListener('change', function(e){
    var row = e.target.closest('.adm-row'); if (!row) return;
    var it = adm.items[+row.getAttribute('data-i')], a = e.target.getAttribute('data-a');
    if (a==='cat') it.cat = e.target.value;
    if (a==='HOT' || a==='ICE'){ var s = {}; it.temps.forEach(function(t){ s[t]=1; }); if (e.target.checked) s[a]=1; else delete s[a]; it.temps = ['HOT','ICE'].filter(function(t){ return s[t]; }); }
    if (a==='hidden'){ it.hidden = e.target.checked; row.classList.toggle('off', it.hidden); }
    if (a==='img' && e.target.files && e.target.files[0]){
      resizeImage(e.target.files[0]).then(function(d){ it.img = d; renderAdmin(); }, function(){ toast('사진을 읽지 못했습니다. JPG나 PNG 파일인지 확인해 주세요.'); });
    }
  });
  $('#adm-list').addEventListener('click', function(e){
    var b = e.target.closest('button'); if (!b) return;
    var row = b.closest('.adm-row'); var idx = +row.getAttribute('data-i'); var a = b.getAttribute('data-a');
    if (a==='noimg'){ adm.items[idx].img = ''; renderAdmin(); }
    if (a==='del'){ adm.items.splice(idx,1); renderAdmin(); }
  });
  $('#adm-save').addEventListener('click', admSave);
  $('#adm-html').addEventListener('click', function(){
    saveFile('index.html', buildPage(admClean()), 'text/html').then(function(r){
      if (r==='saved') toast('지금 편집 중인 메뉴가 담긴 index.html을 받았습니다.');
      else if (r==='declined') toast('저장을 취소했습니다.');
      else toast('이 화면에서는 파일 저장이 막혀 있습니다.');
    });
  });
}

function initAdminAccess(){
  if (!inClaude()){
    // 내려받은 파일로 열었을 때: 주소 끝에 #admin 을 붙이면 메뉴 관리가 열립니다.
    var chk = function(){ $('#admin-open').hidden = location.hash !== '#admin'; if (location.hash==='#admin' && $('#m-admin').hidden) openAdmin(); };
    window.addEventListener('hashchange', chk); chk();
    return;
  }
  cap('user').then(function(u){
    if (!u) return;
    return u.canEdit().then(function(ok){ if (ok) $('#admin-open').hidden = false; });
  }).catch(function(){});
}

/* ---------- 시작 ---------- */
var st = document.createElement('style'); st.textContent = CSS; document.head.appendChild(st);
document.body.insertAdjacentHTML('afterbegin', MARKUP);
var restored = loadDraft();
bind();
renderAll();
initAdminAccess();
(function(){
  var ev = env(), b = $('[data-act="png-copy"]');
  if (!b) return;
  if (ev.needExternal) b.textContent = '브라우저에서 열어 이미지 보내기';
  else if (ev.needSafari) b.textContent = 'Safari에서 열어 이미지 복사';
  else if (ev.useSave){ b.textContent = '견적서 사진으로 저장'; b.classList.add('pri');
    var sv = $('[data-act="png-save"]'); if (sv) sv.hidden = true;
    var h = $('#m-quote .hint'); if (h) h.textContent = '① 견적서 사진으로 저장 → ② 카카오톡 채널 열기 → ③ 대화방 + 버튼 → 앨범에서 견적서 선택 후 전송'; }
})();
if (restored==='carry-ext'){
  openQuote();
  toast(env().useSave
    ? '작성하신 견적을 그대로 불러왔습니다. “견적서 사진으로 저장” → “카카오톡 채널 열기” → 대화방 + 버튼 → 앨범 순서로 보내 주세요.'
    : '작성하신 견적을 그대로 불러왔습니다. “이미지 복사” → “카카오톡 채널 열기” → 입력창 길게 눌러 붙여넣기 순서로 진행해 주세요.', 8000);
}
else if (restored==='carry') toast('메뉴를 저장하고 작성 중이던 견적을 이어서 불러왔습니다.');
else if (restored) toast('임시 저장한 내용을 불러왔습니다 (' + stamp(restored) + ').', 3500);
})();</script>
</body>
</html>
